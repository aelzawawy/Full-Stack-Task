services:
  mongodb:
    image: mongo:latest
    container_name: mongo-auth
    restart: always
    environment:
      # Fix for Linux kernel 6.19+ / 7.x rseq compatibility (SERVER-121912)
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
